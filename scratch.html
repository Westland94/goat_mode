<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scratch Pad — GOAT Mode</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-beat="scratch">
  <!-- Scratch S3: the page shell (SCRATCHPAD-PLAN "Page layout"): type picker → stage ABOVE → editor BELOW → controls →
       variables panel. Static only: picking a type marks it active; the controls are stubs. Styling uses the existing
       classes and tokens in style.css only. Relative links: both builds serve this page. -->
  <header class="top">
    <a href="./" id="scratch-back" class="link">◀ Back to GOAT Mode</a>
  </header>
  <main>
    <h1 id="scratch-title">Scratch Pad</h1>

    <section id="scratch-types" class="row" role="radiogroup" aria-label="Problem type">
      <button type="button" class="btn" id="type-list" data-type="list" role="radio" aria-checked="true">List</button>
      <button type="button" class="btn ghost" id="type-string" data-type="string" role="radio" aria-checked="false">String</button>
      <button type="button" class="btn ghost" id="type-dict" data-type="dict" role="radio" aria-checked="false">Dict</button>
      <button type="button" class="btn ghost" id="type-graph" data-type="graph" role="radio" aria-checked="false">Graph</button>
    </section>

    <section id="scratch-stage" class="card mt" aria-label="Stage">
      <h3>The structure</h3>
      <div class="sp-input-row">
        <input type="text" id="scratch-input" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="e.g. 3, 1, 4, 1, 5">
        <button type="button" class="btn" id="scratch-parse">Show it</button>
      </div>
      <p id="scratch-help" class="muted mt">List: values separated by commas — e.g. 3, 1, 4, 1, 5</p>
      <div id="scratch-fixit" class="sp-fixit" role="alert" hidden></div>
      <div id="scratch-render" aria-live="polite"><p class="muted mt" id="scratch-empty">Your structure will appear here.</p></div>
      <div id="scratch-stackwrap"></div>
    </section>

    <section id="scratch-editor" class="card mt" aria-label="Code">
      <h3>Your code</h3>
      <textarea id="scratch-code" spellcheck="false" autocapitalize="off" autocomplete="off" rows="8" placeholder="# Your code goes here. The input definition will be filled in for you."></textarea>
      <div id="scratch-listing" class="code sp-listing" aria-label="Your code, current line highlighted" hidden></div>
      <button type="button" class="btn ghost mt" id="scratch-edit" hidden>Edit code</button>
    </section>

    <section id="scratch-controls" class="row mt" aria-label="Controls">
      <button type="button" class="btn" id="ctl-run">Run</button>
      <button type="button" class="btn ghost" id="ctl-play">Play</button>
      <button type="button" class="btn ghost" id="ctl-back">◀ Step back</button>
      <button type="button" class="btn ghost" id="ctl-fwd">Step forward ▶</button>
      <button type="button" class="btn ghost" id="ctl-stop">Stop</button>
    </section>
    <div id="scratch-scrubber" class="sp-scrub mt" hidden>
      <input type="range" id="scratch-scrub" min="0" max="0" value="0" step="1" aria-label="Jump to step">
      <span id="scratch-stepno" class="muted"></span>
    </div>

    <p id="scratch-status" class="muted mt" role="status" aria-live="polite"></p>

    <section id="scratch-vars" class="card mt" aria-label="Variables">
      <h3>Variables</h3>
      <div id="scratch-vars-body"><p class="muted">Run your code to see every variable, step by step.</p></div>
    </section>
  </main>
  <script>
    // Scratch S3: static shell. The type picker marks one type active; the controls only log (S6/S7 wire them).
    // Scratch S4: List / String input — parse → validate (≤ 25) → render boxes / character cells immediately, and
    // pre-fill the editor with the definition line for that exact data. Bad input gets a fix-it message; nothing is
    // trimmed or coerced. Dict / Graph input comes later (S5+).
    (() => {
      const CAP = 25;
      const $ = (id) => document.getElementById(id);
      const types = [...document.querySelectorAll('#scratch-types [data-type]')];
      const PLACEHOLDER = { list: 'e.g. 3, 1, 4, 1, 5', string: 'e.g. racecar', dict: 'Dicts come from your code', graph: 'e.g. depot->market, market->harbor' };
      // Scratch S5: ONE graph format — directed edges written from->to, separated by commas. This line is the help.
      const HELP = { list: 'List: values separated by commas — e.g. 3, 1, 4, 1, 5', string: 'String: just type the text — e.g. racecar',
        dict: 'Dict: no input to paste — dicts come from your code, and you\'ll see them when you run it.',
        graph: 'Graph: edges as from->to, separated by commas — e.g. depot->market, market->harbor, market->cliff' };
      const NODE_CAP = 14, NAME = /^[A-Za-z_][A-Za-z0-9_]*$/;
      const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
      const NUMBER = /^-?(0|[1-9][0-9]*)(\.[0-9]+)?$/;   // a Python int/float literal; "007" or "1e3" stay strings (no coercion)
      const pyStr = (t) => "'" + t.replace(/\\/g, '\\\\').replace(/'/g, "\\'") + "'";
      const dqStr = (t) => '"' + t.replace(/\\/g, '\\\\').replace(/"/g, '\\"') + '"';
      function parse(type, raw) {
        if (type === 'list') {
          if (!raw.trim()) return { error: 'Type at least one value, separated by commas — like 3, 1, 4.' };
          const parts = raw.split(',').map((t) => t.trim());
          if (parts.length > CAP) return { error: `That's ${parts.length} values — the Scratch Pad shows up to ${CAP}. Remove ${parts.length - CAP} and try again.` };
          const empty = parts.findIndex((t) => t === '');
          if (empty !== -1) return { error: `Value ${empty + 1} is empty — remove the extra comma.` };
          const items = parts.map((t) => NUMBER.test(t) ? { kind: 'num', text: t } : { kind: 'str', text: t });
          return { type, name: 'nums', items, definition: `nums = [${items.map((x) => x.kind === 'num' ? x.text : pyStr(x.text)).join(', ')}]` };
        }
        if (type === 'string') {
          if (raw === '') return { error: 'Type some text — like racecar.' };
          const chars = [...raw];
          if (chars.length > CAP) return { error: `That's ${chars.length} characters — the Scratch Pad shows up to ${CAP}. Remove ${chars.length - CAP} and try again.` };
          return { type, name: 's', items: chars.map((c) => ({ kind: 'char', text: c })), definition: `s = ${dqStr(raw)}` };
        }
        if (type === 'graph') {
          if (!raw.trim()) return { error: 'Type at least one edge — like depot->market.' };
          const parts = raw.split(',').map((t) => t.trim());
          const nodes = [], adj = {}, seen = new Set();
          const add = (n) => { if (!(n in adj)) { adj[n] = []; nodes.push(n); } };
          for (let k = 0; k < parts.length; k++) {
            const piece = parts[k];
            if (piece === '') return { error: `Edge ${k + 1} is empty — remove the extra comma.` };
            const m = piece.match(/^(.*?)\s*->\s*(.*)$/);
            if (!m) return { error: `"${piece}" isn't an edge — write it as from->to, like depot->market.` };
            const [from, to] = [m[1].trim(), m[2].trim()];
            for (const n of [from, to]) if (!NAME.test(n)) return { error: `"${n || '(blank)'}" in "${piece}" isn't a node name — use letters, digits and _, starting with a letter.` };
            if (seen.has(`${from}->${to}`)) return { error: `${from}->${to} is listed twice — keep one.` };
            seen.add(`${from}->${to}`); add(from); add(to); adj[from].push(to);
          }
          if (nodes.length > NODE_CAP) return { error: `That's ${nodes.length} nodes — the Scratch Pad shows up to ${NODE_CAP}. Remove ${nodes.length - NODE_CAP} and try again.` };
          const edges = nodes.flatMap((n) => adj[n].map((t) => [n, t]));
          const def = `graph = {${nodes.map((n) => `${pyStr(n)}: [${adj[n].map(pyStr).join(', ')}]`).join(', ')}}`;
          return { type, name: 'graph', nodes, edges, definition: def };
        }
        return { error: 'Dicts come from your code — there\'s no input to paste. Pick List, String or Graph to paste an input.' };
      }
      // the kit-132 graph device's layout rule (stage.html makePlayer, no authored positions): first-seen order on a
      // circle, the first node at the top, clockwise; directed edges as lines with a head dot at the target end
      function renderGraph(res) {
        const NS = 'http://www.w3.org/2000/svg', W = 400, H = 340, CX = 200, CY = 160, RAD = 118, R = 18;
        const svg = document.createElementNS(NS, 'svg'); svg.setAttribute('viewBox', `0 0 ${W} ${H}`); svg.setAttribute('class', 'sp-graph'); svg.id = 'scratch-graph';
        const mk = (tag, attrs, parent = svg) => { const n = document.createElementNS(NS, tag); for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v); parent.append(n); return n; };
        const pos = {};
        res.nodes.forEach((n, k) => { const a = -Math.PI / 2 + 2 * Math.PI * k / Math.max(1, res.nodes.length); pos[n] = [CX + RAD * Math.cos(a), CY + RAD * Math.sin(a)]; });
        const gE = mk('g', { class: 'sp-edges' }), gN = mk('g', { class: 'sp-nodes' });
        for (const [a, b] of res.edges) {
          const [x1, y1] = pos[a], [x2, y2] = pos[b];
          if (a === b) { mk('circle', { cx: x1, cy: y1 - R - 8, r: 9, class: 'sp-edge sp-loop', 'data-edge': `${a}->${b}` }, gE); continue; }
          const d = Math.hypot(x2 - x1, y2 - y1) || 1, ux = (x2 - x1) / d, uy = (y2 - y1) / d;
          mk('line', { x1: x1 + ux * (R + 3), y1: y1 + uy * (R + 3), x2: x2 - ux * (R + 3), y2: y2 - uy * (R + 3), class: 'sp-edge', 'data-edge': `${a}->${b}` }, gE);
          mk('circle', { cx: x2 - ux * (R + 7), cy: y2 - uy * (R + 7), r: 4, class: 'sp-head' }, gE);
        }
        for (const n of res.nodes) {
          const [x, y] = pos[n]; const g = mk('g', { class: 'sp-node', 'data-node': n }, gN);
          mk('circle', { cx: x, cy: y, r: R }, g);
          const t = mk('text', { x, y: y + R + 14, 'text-anchor': 'middle' }, g); t.textContent = n;
        }
        return svg;
      }
      let lastShown = null;   // S7: the last structure the stage showed (Stop puts it back)
      function render(res, prefill = true) {   // S7: Stop redraws the stage with prefill = false (the editor is never touched)
        if (!res.error) lastShown = res;
        const box = $('scratch-render'), fix = $('scratch-fixit');
        box.replaceChildren();
        if (res.error) { fix.textContent = res.error; fix.hidden = false; return; }   // render nothing on bad input
        fix.hidden = true; fix.textContent = '';
        if (res.type === 'graph') {
          box.append(el('p', 'muted', `${res.name} — ${res.nodes.length} node${res.nodes.length === 1 ? '' : 's'}, ${res.edges.length} edge${res.edges.length === 1 ? '' : 's'}`), renderGraph(res));
          if (prefill) $('scratch-code').value = res.definition + '\n';
          return;
        }
        const row = el('div', 'sp-cells'); row.id = 'scratch-cells'; row.dataset.kind = res.type;
        res.items.forEach((x, i) => {
          const cell = el('div', 'sp-cell'); cell.dataset.index = i;
          cell.append(el('div', 'sp-val', x.kind === 'str' ? pyStr(x.text) : x.text), el('div', 'sp-idx', String(i)));
          row.append(cell);
        });
        box.append(el('p', 'muted', `${res.name} — ${res.items.length} ${res.type === 'string' ? 'character' : 'value'}${res.items.length === 1 ? '' : 's'}`), row);
        if (prefill) $('scratch-code').value = res.definition + '\n';
      }
      const current = () => document.body.dataset.scratchType || 'list';
      const go = () => render(parse(current(), $('scratch-input').value));
      $('scratch-parse').addEventListener('click', go);
      $('scratch-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); });
      $('scratch-input').addEventListener('paste', () => setTimeout(go, 0));
      const reset = (type) => { lastShown = null; $('scratch-input').value = ''; $('scratch-input').placeholder = PLACEHOLDER[type]; $('scratch-fixit').hidden = true; $('scratch-help').textContent = HELP[type];
        $('scratch-render').replaceChildren(Object.assign(el('p', 'muted mt', 'Your structure will appear here.'), { id: 'scratch-empty' })); };
      for (const b of types) b.addEventListener('click', () => {
        for (const o of types) { o.className = o === b ? 'btn' : 'btn ghost'; o.setAttribute('aria-checked', String(o === b)); }
        document.body.dataset.scratchType = b.dataset.type; reset(b.dataset.type);
      });
      document.body.dataset.scratchType = 'list';
      // ---- Scratch S6: Run. The editor's code (whatever it holds — the S4/S5 pre-fill defines the input) goes to
      // the in-browser worker's tracer via the shim, route api/scratch-trace (1,000-step cap; routes.py). The stream
      // is kept on the page (window.scratchRun) for S7's playback; Run ends showing step 0. The shim is imported on
      // first Run (as stage.html does), so Python only boots when asked. The Mac app build has no shim/worker
      // (that import 404s): Run says so instead of using the server's 2,000-step lesson tracer.
      const STEP_CAP = 1000;
      window.scratchRun = null;
      const status = (t) => { $('scratch-status').textContent = t; };
      async function shim() {
        if (typeof window.goatShim !== 'function') await import('./shim/goat-shim.mjs');
        return window.goatShim;
      }
      // ---- Scratch S7: playback over the stored stream (never re-runs). One index, window.scratchRun.current,
      // drives everything: the listing's highlighted line, the variables panel, the scrubber and the step label.
      // The display at step k is the state AFTER line k ran (S2's rule), with line k highlighted.
      const PACE_MS = 450;
      let timer = null, runToken = 0;
      const listing = $('scratch-listing');
      function showListing(code) {
        const lines = code.replace(/\n$/, '').split('\n');
        listing.replaceChildren(...lines.map((t, k) => { const ln = el('div', 'ln'); ln.dataset.line = k + 1; ln.append(el('span', 'n', String(k + 1)), el('span', 't', t || ' ')); return ln; }));
        listing.hidden = false; $('scratch-code').hidden = true; $('scratch-edit').hidden = false;
      }
      function showEditor() {
        listing.hidden = true; listing.replaceChildren(); $('scratch-code').hidden = false; $('scratch-edit').hidden = true;
      }
      // Task 129's rule — never a memory address. The tracer's show() strips it when a whole repr is <...>; an object
      // NESTED in a container (a list of Node objects) still carries " at 0x…" inside, so the panel strips it too.
      const noAddress = (t) => String(t).replace(/ at 0x[0-9a-fA-F]+/g, '');
      // ---- Scratch S9: the list device. The stage shows the structure variable (the pasted list's name, `nums`) as
      // boxes at the current step, from the stored stream only. Frames are precomputed once per Run:
      //   values  — the list's top-level element reprs in steps[k].after (addresses stripped, S8 rule)
      //   writes  — same length, element changed (index write, swap, in-place sort) → highlighted for that step
      //   added   — new boxes (append / insert)      removed — boxes gone this step (pop / remove), shown fading out
      //   reads   — `name[expr]` read on line k, expr evaluated on steps[k].before (ints, names, + / -, len(name))
      // Event cap 400 (SCRATCHPAD-PLAN): events are counted along the stream; past the cap, values keep updating
      // with no highlight/animation classes.
      const EVENT_CAP = 400;
      // sp18: a Python str repr → its characters (each shown as itself; control characters as their escape), or null.
      function strChars(repr) {
        if (typeof repr !== 'string' || repr.length < 2) return null;
        const q = repr[0]; if ((q !== "'" && q !== '"') || repr[repr.length - 1] !== q) return null;
        const body = repr.slice(1, -1), out = [];
        const SIMPLE = { n: '\\n', t: '\\t', r: '\\r', '\\': '\\', "'": "'", '"': '"', '0': '\\0' };
        for (let i = 0; i < body.length; i++) {
          const c = body[i];
          if (c !== '\\') { const cp = body.codePointAt(i); out.push(String.fromCodePoint(cp)); if (cp > 0xffff) i++; continue; }
          const e = body[++i];
          if (e === 'x') { out.push(String.fromCodePoint(parseInt(body.substr(i + 1, 2), 16))); i += 2; }
          else if (e === 'u') { out.push(String.fromCodePoint(parseInt(body.substr(i + 1, 4), 16))); i += 4; }
          else if (e === 'U') { out.push(String.fromCodePoint(parseInt(body.substr(i + 1, 8), 16))); i += 8; }
          else out.push(SIMPLE[e] !== undefined ? SIMPLE[e] : '\\' + e);
        }
        return out;
      }
      // sp18: the stage's sequence — a list's top-level items, or a string's characters
      const seqItems = (repr) => topItems(repr) || strChars(repr);
      function topItems(repr) {   // "[1, 'a,b', [2, 3]]" → ["1", "'a,b'", "[2, 3]"]; null if not a list repr
        if (typeof repr !== 'string') return null;
        const t = repr.trim(); if (t[0] !== '[' || t[t.length - 1] !== ']') return null;
        const body = t.slice(1, -1); if (!body.trim()) return [];
        const out = []; let depth = 0, q = null, start = 0;
        for (let i = 0; i < body.length; i++) {
          const c = body[i];
          if (q) { if (c === '\\') i++; else if (c === q) q = null; continue; }
          if (c === "'" || c === '"') q = c;
          else if ('([{<'.includes(c)) depth++;
          else if (')]}>'.includes(c)) depth--;
          else if (c === ',' && depth === 0) { out.push(body.slice(start, i).trim()); start = i + 1; }
        }
        out.push(body.slice(start).trim());
        return out.map(noAddress);
      }
      function evalIndex(expr, vars, name, len, raw = false) {   // small, honest: ints, names, len(name), + and -; else null (sp25: raw → the integer itself, unclamped)
        const src = expr.replace(new RegExp(`len\\(\\s*${name}\\s*\\)`, 'g'), String(len)).trim();
        if (!/^[A-Za-z_0-9+\-\s]+$/.test(src)) return null;
        const toks = src.match(/[A-Za-z_][A-Za-z_0-9]*|\d+|[+\-]/g) || [];
        let total = 0, sign = 1, want = 'term';
        for (const tk of toks) {
          if (tk === '+' || tk === '-') { if (want === 'term') { if (tk === '-') sign = -sign; continue; } sign = tk === '-' ? -1 : 1; want = 'term'; continue; }
          if (want !== 'term') return null;
          let v;
          if (/^\d+$/.test(tk)) v = Number(tk);
          else { const r = vars[tk]; if (typeof r !== 'string' || !/^-?\d+$/.test(r)) return null; v = Number(r); }
          total += sign * v; sign = 1; want = 'op';
        }
        if (want === 'term') return null;
        if (raw) return total;
        const i = total < 0 ? len + total : total;
        return i >= 0 && i < len ? i : null;
      }
      function readsOn(lineText, name, vars, len) {
        const eq = lineText.search(/(?<![=!<>+\-*/%&|^@:])=(?!=)/);
        const aug = /^\s*[^=]*?[+\-*/%&|^@]=(?!=)/.test(lineText);
        const re = new RegExp(`\\b${name}\\s*\\[([^\\[\\]:]+)\\]`, 'g'), out = new Set();
        let m; while ((m = re.exec(lineText))) {
          if (eq !== -1 && m.index < eq && !aug) continue;      // a plain assignment target is a write, not a read
          const i = evalIndex(m[1], vars, name, len); if (i !== null) out.add(i);
        }
        return [...out];
      }
      // anim-3: value-tile identity. Each value tile gets a stable id that FOLLOWS ITS VALUE through the stream: a swap
      // or in-place sort permutes the ids (equal values matched to the same index first, then the nearest one), an
      // insert / append gives the new tile a fresh id and shifts the rest, a pop / remove drops one id, a write keeps
      // the id (the tile stays, its value changes). The tile is keyed val:<id>, so between ANY two drawn steps (forward,
      // back or a long scrub) the motion layer slides each tile from where its value was to where it is.
      // sp26 (fix F2): a shrinking slice assignment on this step's line — `name[a:b] = …` whose replacement is SHORTER
      // than the slice. Returns {a, b, r} (r = replacement length), or null. Bounds evaluated on `before` (names,
      // ints, len(name), + / -; negatives from the end; missing = 0 / len), clamped like Python.
      function sliceShrink(lineText, name, vars, before, after) {
        const S = name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const m = lineText.match(new RegExp(`^\\s*${S}\\s*\\[\\s*([^:\\]]*)\\s*:\\s*([^:\\]]*)\\s*\\]\\s*=(?!=)`));
        if (!m || !before || !after) return null;
        const nb = before.length, bound = (t, dflt) => { if (!t.trim()) return dflt; const v = evalIndex(t, vars, name, nb, true); if (v === null) return null; return Math.max(0, Math.min(nb, v < 0 ? v + nb : v)); };
        const a = bound(m[1], 0), b0 = bound(m[2], nb); if (a === null || b0 === null) return null;
        const b = Math.max(a, b0), r = after.length - nb + (b - a);
        if (r < 0 || r >= b - a) return null;                                  // shrink only (growth / same size: unchanged)
        for (let i = 0; i < a; i++) if (before[i] !== after[i]) return null;   // must really be before[:a] + R + before[b:]
        for (let i = b; i < nb; i++) if (before[i] !== after[i - (b - a) + r]) return null;
        return { a, b, r };
      }
      function tileIds(prevVals, prevIds, before, after, fresh, slice = null) {
        const same = (x, y) => x && y && x.length === y.length && x.every((v, i) => v === y[i]);
        const idsB = before ? (same(prevVals, before) ? [...prevIds] : before.map((_, i) => (prevIds && prevIds[i] != null ? prevIds[i] : fresh()))) : null;
        if (!idsB) return after.map(() => fresh());
        const nb = before.length, na = after.length;
        if (slice) return [...idsB.slice(0, slice.a + slice.r), ...idsB.slice(slice.b)];   // sp26: written slots keep their tiles, the cut tiles leave, the tail keeps its tiles (they slide left)
        if (na === nb) {
          const sorted = (x) => [...x].sort().join('\u0001');
          if (sorted(before) !== sorted(after) || same(before, after)) return idsB;   // writes (or nothing): tiles stay
          const used = new Set();
          return after.map((v, i) => {
            let best = -1;
            for (let j = 0; j < nb; j++) if (!used.has(j) && before[j] === v && (best === -1 || Math.abs(j - i) < Math.abs(best - i))) best = j;
            used.add(best); return idsB[best];
          });
        }
        let p = 0; while (p < nb && p < na && before[p] === after[p]) p++;
        let sfx = 0; while (sfx < nb - p && sfx < na - p && before[nb - 1 - sfx] === after[na - 1 - sfx]) sfx++;
        if (na > nb && p + sfx >= nb) return [...idsB.slice(0, p), ...Array.from({ length: na - nb }, fresh), ...idsB.slice(p)];
        if (na < nb && p + sfx >= na) return [...idsB.slice(0, p), ...idsB.slice(p + (nb - na))];
        return after.map((_, i) => (i < nb ? idsB[i] : fresh()));
      }
      function buildListFrames(run, name) {
        const lines = run.code.split('\n');
        let events = 0, capped = false, nextId = 0, pv = null, pid = null;

            frames = [K(m.dx, m.dy, 0), K(exitX - l.left, m.dy, o), K(entryX - l.left, 0, o), K(0, 0, 1)];
          }
          n.animate(frames, { duration: dur, easing, id: 'sp-motion' });
        }
      }
      function showStep(k) {
        const run = window.scratchRun, body = $('scratch-vars-body');
        if (!run || !run.steps.length) { body.replaceChildren(el('p', 'muted', run && run.error ? 'No step ran.' : 'Nothing ran.')); return; }
        k = Math.max(0, Math.min(run.steps.length - 1, k));
        const st = run.steps[k]; run.current = k;
        const isErr = run.errorStep && run.errorStep.index === k;
        for (const ln of listing.children) ln.className = 'ln';
        const cur = listing.querySelector(`[data-line="${st.line}"]`);
        if (cur) {
          cur.className = isErr ? 'ln stop' : 'ln cur';
          const top = cur.offsetTop - listing.offsetTop, h = listing.clientHeight;   // keep it visible inside the listing only
          if (top < listing.scrollTop || top + cur.offsetHeight > listing.scrollTop + h) listing.scrollTop = Math.max(0, top - h / 3);
        }
        listing.dataset.current = st.line;
        // Scratch S8: the variables panel — the lesson execute panel's markup and rule (app.js watchValue/codePanel):
        // a .vars table, one row per variable in scope after this step, and "changed" = before !== after for this
        // step (a variable new at this step counts as changed). The C2 var-flash (style.css MOTION block,
        // `.vars tr.changed td:last-child`) replays because the rows are rebuilt every step.
        const vars = st.after || st.before || {}, before = st.before || {}, names = Object.keys(vars);
        const table = el('table'); table.id = 'scratch-varlist';
        for (const n of names) {
          const changed = before[n] !== vars[n];
          const tr = el('tr', changed ? 'sp-var changed' : 'sp-var'); tr.dataset.name = n;
          const v = el('td', 'sp-var-val', noAddress(vars[n])); v.dataset.var = n;
          tr.append(el('td', 'sp-var-name', n), v); table.append(tr);
        }
        const list = el('div', 'vars sp-vars'); list.append(table);
        const head = `Step ${k + 1} of ${run.steps.length} · line ${st.line}` + (isErr ? (run.recursion ? ' · the calls piled up too deep here' : ` · ${run.errorStep.kind} here`) : '') + (k === run.steps.length - 1 && run.stopped === 'step_limit' ? ' · stopped at the step limit' : '');
        body.replaceChildren(el('p', 'muted', head), names.length ? list : el('p', 'muted', 'No variables yet.'));
        const motionFirst = motionSnapshot();   // anim-1: measure before the new frame
        drawList(k);
        drawGraph(k);  // S12
        drawDict(k);   // S11
        drawStack(k);  // S13
        motionPlay(motionFirst);   // anim-1: move from the old frame to the new one
        $('scratch-scrub').value = String(k); $('scratch-stepno').textContent = `${k + 1} / ${run.steps.length}`;
        $('ctl-back').disabled = k === 0; $('ctl-fwd').disabled = k === run.steps.length - 1;
      }
      const playing = () => timer !== null;
      function pause() { if (timer !== null) { clearInterval(timer); timer = null; } $('ctl-play').textContent = 'Play'; }
      function play() {
        const run = window.scratchRun; if (!run || !run.steps.length) return;
        if (run.current >= run.steps.length - 1) showStep(0);   // Play at the end starts over
        $('ctl-play').textContent = 'Pause';
        timer = setInterval(() => { const r = window.scratchRun; if (!r || r.current >= r.steps.length - 1) { pause(); return; } showStep(r.current + 1); }, PACE_MS);
      }
      function clearRunView() {
        pause(); window.scratchRun = null; showEditor();
        $('scratch-scrubber').hidden = true; $('ctl-back').disabled = false; $('ctl-fwd').disabled = false;
        $('scratch-vars-body').replaceChildren(el('p', 'muted', 'Run your code to see every variable, step by step.'));
        $('scratch-stackwrap').replaceChildren();   // S13
        if (lastShown) render(lastShown, false);   // S9: the stage goes back to the pasted structure (never touches the editor)
      }
      // sp18: the first top-level `name = [` / `name = '` / `name = "` line in the code — the worker's first guess
      function staticGuess(code) { const m = code.match(/^([A-Za-z_]\w*)\s*=\s*(?:\[|'|"|[rbuRBU]?"|[rbuRBU]?')/m); return m ? m[1] : null; }
      // sp18: the first variable the trace binds, at the top level (call depth 1), to a str or list value
      // sp29 (fix F5): names bound ONLY as iteration variables (for-loop or comprehension targets) are never promoted —
      // a loop variable holding one key / one character is not a structure. A name that is also bound by a plain
      // assignment somewhere (`name = …`, `name += …`, or as an unpacking target) can still be promoted.
      function iterationOnly(code) {
        const targets = new Set(), assigned = new Set();
        for (const m of code.matchAll(/\bfor\s+([A-Za-z_]\w*(?:\s*,\s*[A-Za-z_]\w*)*)\s+in\b/g)) m[1].split(',').forEach((n) => targets.add(n.trim()));
        for (const m of code.matchAll(/^[ \t]*([A-Za-z_]\w*(?:\s*,\s*[A-Za-z_]\w*)*)\s*(?:[-+*/%&|^@]|\/\/|\*\*|<<|>>)?=(?!=)/gm)) m[1].split(',').forEach((n) => assigned.add(n.trim()));
        return new Set([...targets].filter((n) => !assigned.has(n)));
      }
      function promote(res, code) {
        const seen = new Set(), skip = iterationOnly(code || '');
        for (let k = 0; k < (res.steps || []).length; k++) {
          if (res.stacks && res.stacks[k] && res.stacks[k].depth > 1) continue;
          for (const [name, rep] of Object.entries(res.steps[k].after || {})) {
            if (seen.has(name)) continue; seen.add(name);
            if (skip.has(name)) continue;   // sp29
            if (seqItems(rep) !== null) return name;
          }
        }
        return null;
      }
      async function run() {
        const code = $('scratch-code').value;
        if (!code.trim()) { status('Write some code first — or paste an input above to start from its definition.'); return; }
        clearRunView();
        const token = ++runToken;
        $('ctl-run').disabled = true; status('Running…');
        let go;
        try { go = await shim(); } catch { $('ctl-run').disabled = false; status('Run works in the web build of GOAT Mode for now — this Mac app build has no in-browser Python.'); return; }
        try {
          // sp18: the stage structure. Pasted input wins (List / String / Graph, by the picked type). With no pasted
          // structure (List / String / Dict types), the FIRST top-level variable the trace binds to a str or list is
          // promoted (andrew's `s = "…"` + l/r loop). The worker needs the name up front for its static index users,
          // so the first request uses a guess from the code text (the first top-level `name = [ / ' / "` line); if the
          // trace then promotes a different name, the same code is traced once more with that name.
          const ty = current(), pasted = lastShown && lastShown.type === ty && (ty === 'list' || ty === 'string' || ty === 'graph') ? lastShown.name : null;
          const guess = pasted || (ty === 'graph' ? 'graph' : staticGuess(code));
          const ask = async (name) => { const rr = await go('api/scratch-trace', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(name ? { code, structure: name } : { code }) }); return [rr, await rr.json()]; };
          let [r, res] = await ask(guess), structure = guess;
          if (r.ok && !pasted && ty !== 'graph') {
            const promoted = promote(res, code);
            if (promoted && promoted !== guess) { [r, res] = await ask(promoted); }
            structure = promoted;
          }
          if (token !== runToken) return;                      // Stop (or a newer Run) took over while this ran
          if (!r.ok) { status(`The run couldn't start: ${res.error || r.status}`); return; }
          const err = res.error || null;
          const errStep = err && err.type !== 'StepLimit' && res.steps.length ? res.steps.length - 1 : null;
          window.scratchRun = { code, steps: res.steps, stdout: res.stdout, error: err, stopped: res.stopped || null, timeout: !!res.timeout, cap: STEP_CAP, current: 0,
            errorStep: errStep == null ? null : { index: errStep, line: err.line ?? res.steps[errStep].line, kind: err.type, message: err.message, variables: res.steps[errStep].after || res.steps[errStep].before || {} } };
          const n = res.steps.length;
          window.scratchRun.stacks = res.stacks || null; window.scratchRun.returns = res.returns || {};   // S13
          window.scratchRun.stackUsed = !!(res.stacks && res.stacks.some((x) => x.depth > 1));
          if (err && err.type === 'RecursionError' && res.stacks && n) {
            const deepest = res.stacks.reduce((m, x, i) => (x.depth > res.stacks[m].depth ? i : m), 0);
            window.scratchRun.recursion = { depth: res.stacks[deepest].depth, step: deepest };
          }
          // S9: the list device runs for the List type, on the pasted list's name (S4 contract: nums)
          window.scratchRun.dict = buildDictFrames(window.scratchRun);   // S11: null when no dict is built
          if (structure && current() === 'graph') {   // S12: the graph device (the dict device skips the graph itself)
            window.scratchRun.graph = buildGraphFrames(window.scratchRun, structure, res, lastShown && lastShown.type === 'graph' ? lastShown.nodes.map(pyStr) : []);
            if (window.scratchRun.dict && window.scratchRun.dict.name === structure) window.scratchRun.dict = null;
          } else if (structure) {
            window.scratchRun.list = buildListFrames(window.scratchRun, structure);
            if (!window.scratchRun.list.frames.some((f) => f.values)) window.scratchRun.list = null;   // S13: code that never builds the list keeps the static stage
            window.scratchRun.pointers = buildPointers(window.scratchRun, structure, res.index_users || []);   // S10
            window.scratchRun.cursor = buildCursor(window.scratchRun, structure);   // anim-ic
          }
          if (res.stopped === 'step_limit') status(`Still running at step ${n.toLocaleString()} — this looks like a loop. Frozen there; scrub back to watch it.`);
          else if (res.timeout) status('Stopped after 2 seconds — probably a loop that never ends.');
          else if (window.scratchRun.recursion) status(`The calls kept piling up — stopped at ${window.scratchRun.recursion.depth.toLocaleString()} calls deep. Showing the deepest step.`);
          else if (err) status(`${err.type} on line ${err.line ?? '?'}: ${err.message} — ${n} step${n === 1 ? '' : 's'} ran.`);
          else status(`Ran ${n} step${n === 1 ? '' : 's'}.`);
          if (n) { showListing(code); $('scratch-scrub').max = String(n - 1); $('scratch-scrubber').hidden = false; }
          // S13: a RecursionError freezes at max depth; S14: a step-cap run freezes on its cap step (the structure stuck mid-loop)
          showStep(window.scratchRun.recursion ? window.scratchRun.recursion.step : res.stopped === 'step_limit' ? n - 1 : 0);
        } finally { if (token === runToken) $('ctl-run').disabled = false; }
      }
      // Stop: always live. Ends playback, kills the worker mid-run if one is running (fresh worker via the shim),
      // puts the stage back to the pasted structure and clears the variables. The editor code is kept.
      async function stop() {
        runToken += 1; clearRunView(); $('ctl-run').disabled = false;
        if (window.goatShimInfo && typeof window.goatShimInfo.restart === 'function') window.goatShimInfo.restart();
        if (lastShown) render(lastShown, false);
        status('Stopped. Your code is still in the editor — press Run to run it again.');
      }
      $('ctl-run').addEventListener('click', run);
      $('ctl-play').addEventListener('click', () => (playing() ? pause() : play()));
      $('ctl-back').addEventListener('click', () => { pause(); if (window.scratchRun) showStep(window.scratchRun.current - 1); });
      $('ctl-fwd').addEventListener('click', () => { pause(); if (window.scratchRun) showStep(window.scratchRun.current + 1); });
      $('scratch-scrub').addEventListener('input', (e) => { pause(); if (window.scratchRun) showStep(Number(e.target.value)); });
      $('ctl-stop').addEventListener('click', stop);
      $('scratch-edit').addEventListener('click', () => { clearRunView(); status('Editing — press Run when ready.'); $('scratch-code').focus(); });
    })();
  </script>
